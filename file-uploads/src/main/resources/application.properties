server.port=${PORT:8080}
logging.level.org.atmosphere=warn

vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.example
vaadin.frontend.hotdeploy=true

# Multipart uploads go through the servlet container, where Spring Boot caps a
# file at 1 MB by default. Phone photos are larger than that and UC5 is about
# large files, so raise the container limit; each use case sets its own limit
# on the component.
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

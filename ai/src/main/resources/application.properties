server.port=${PORT:8080}
logging.level.org.atmosphere=warn

vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.example
vaadin.frontend.hotdeploy=true

# The AI providers read their keys from the environment: OPENAI_API_KEY
# (UC1–UC4), ELEVENLABS_API_KEY (UC5) and HEYGEN_API_KEY (UC6). The empty
# defaults let the app start without them; a use case whose key is missing
# says so instead of calling the provider.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-5.4-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small
# Speech comes from ElevenLabs. OpenAI's other models are not used.
spring.ai.model.audio.speech=elevenlabs
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
spring.ai.elevenlabs.tts.model-id=eleven_multilingual_v2
spring.ai.elevenlabs.tts.output-format=mp3_44100_128
# UC5 — at most this many voice-overs per day, for all users together.
app.elevenlabs.clips-per-day=50

# UC4 — the MCP server that serves the product documentation.
app.docs-mcp.url=https://mcp.vaadin.com/docs
# The server's tools the model may call.
app.docs-mcp.tools=search_vaadin_docs,get_full_document

# UC6 — HeyGen. Rendering a video takes a few minutes and costs credits, so
# the app renders at most this many videos per day, for all users together.
app.heygen.base-url=https://api.heygen.com
app.heygen.api-key=${HEYGEN_API_KEY:}
app.heygen.poll-interval=5s
app.heygen.videos-per-day=5

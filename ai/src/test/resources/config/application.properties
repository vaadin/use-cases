# Tests never call an AI service: the models are switched off here and
# replaced by the fakes in AiTestConfiguration.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# Pretend every provider is configured, so the views enable their actions.
OPENAI_API_KEY=test
ELEVENLABS_API_KEY=test
HEYGEN_API_KEY=test

app.heygen.poll-interval=20ms
app.heygen.videos-per-day=1000
app.elevenlabs.clips-per-day=1000

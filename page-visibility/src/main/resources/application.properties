server.port=${PORT:8080}
logging.level.org.atmosphere=warn

vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.example
# Run under a strict, nonce-based Content Security Policy
vaadin.csp=strict
vaadin.frontend.hotdeploy=true

# VAPID key pair for Web Push (UC3). The literal value __GENERATE__ tells
# WebPushConfig to mint an ephemeral pair on startup; replace with real
# keys (`npx web-push generate-vapid-keys`) for any persistent deployment.
app.webpush.public-key=__GENERATE__
app.webpush.private-key=__GENERATE__
app.webpush.subject=mailto:demo@vaadin.com

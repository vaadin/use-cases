server.port=${PORT:8080}
logging.level.org.atmosphere=warn

vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.example
vaadin.frontend.hotdeploy=true

# UC15 uploads a PDF of up to 10 MB. Spring Boot caps a multipart file at 1 MB
# by default; the server enforces this limit, Upload#setMaxFileSize only the
# browser.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

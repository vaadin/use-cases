server.port=${PORT:8080}
logging.level.org.atmosphere=warn

vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.example
vaadin.frontend.hotdeploy=true

# Short heartbeat so that browser tabs (UC6, UC7) that were closed expire
# within about a minute instead of the default 15 minutes. A browser tab is
# destroyed once none of its UIs has sent a heartbeat for three intervals.
vaadin.heartbeatInterval=20

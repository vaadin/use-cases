server.port=${PORT:8080}
logging.level.org.atmosphere=warn

vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.example
vaadin.frontend.hotdeploy=true

# The only cleanup mechanism there is. Nothing removes a peer whose browser
# vanished without detaching (API-GAPS.md #1), so this module leans on the one
# thing that eventually does: Vaadin closes a UI after three missed
# heartbeats, and closing it detaches its components, which runs the leave
# listeners that presence and field highlighting hang off. At the default
# interval of five minutes a killed tab leaves ghost avatars and stuck field
# highlights for a quarter of an hour, which in a demo reads as a bug; fifteen
# seconds clears them in about a minute. Closing idle sessions does the same
# one level up.
#
# Worth noticing that this is a workaround, not a solution: it cannot help a
# server that died, and its resolution is the heartbeat interval rather than
# the moment the user left.
vaadin.heartbeatInterval=15
vaadin.closeIdleSessions=true

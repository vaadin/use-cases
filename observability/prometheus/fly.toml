# fly.toml app configuration file for observability-cases-prometheus
#
# Prometheus for UC7 of the observability module. Scrapes observability-cases
# over Fly's private network (see fly.yaml) and is exposed publicly, read-only,
# so the UC7 view can link to its targets page and graph explorer. The admin
# and lifecycle APIs are off (Prometheus defaults).
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'observability-cases-prometheus'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

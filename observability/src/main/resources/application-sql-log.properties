# Opt-in profile: the same N+1 UC2 surfaces through the kit's
# vaadin.db.fetch.rows meter, logged as SQL by Hibernate as well. Kept out of
# application.properties because it spams the log of every use case in this
# module, not just UC2:
#
#   mvn spring-boot:run -pl :observability-use-cases -Dspring-boot.run.profiles=sql-log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

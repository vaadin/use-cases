# fly.toml app configuration file for observability-cases
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'observability-cases'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1024'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024

[env]
  # UC7: the monitoring stack runs as two sibling Fly apps (prometheus/ and
  # grafana/ in this module). Browser links use the public hostnames; the
  # view's own Prometheus API calls stay on the private network.
  UC7_PROMETHEUS_URL = 'https://observability-cases-prometheus.fly.dev'
  UC7_PROMETHEUS_API_URL = 'http://observability-cases-prometheus.internal:9090'
  UC7_GRAFANA_URL = 'https://observability-cases-grafana.fly.dev'

apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # Grafana expands environment variables in provisioning files. compose.yaml
    # sets this to the compose service (http://prometheus:9090); the Fly app
    # sets it to the sibling app's private hostname (see grafana/fly.toml).
    url: ${PROMETHEUS_URL}
    isDefault: true

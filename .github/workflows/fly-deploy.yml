# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # A deployable is any directory holding a fly.toml: the top-level Maven
          # modules, and the sidecar apps a module ships one level below it
          # (observability/prometheus, observability/grafana).
          all_modules=$(find . -mindepth 2 -maxdepth 3 -name fly.toml -printf '%h\n' \
            | sed 's|^\./||' \
            | sort)
          all_json=$(printf '%s\n' "$all_modules" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          select_all() {
            echo "Selecting all modules: reason=$1"
            echo "modules=$all_json" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Manual runs always redeploy everything.
          if [ "$EVENT_NAME" != "push" ]; then
            select_all "event=$EVENT_NAME"
          fi

          # First push to the branch (no parent SHA) - redeploy everything.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            select_all "first push"
          fi

          changed=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          echo "Changed files:"
          echo "$changed"

          # Anything outside a module directory (parent pom, common module,
          # Maven wrapper, this workflow) forces a full redeploy.
          shared_re='^(common/|pom\.xml$|mvnw($|\.cmd$)|\.mvn/|\.github/workflows/fly-deploy\.yml$)'
          if echo "$changed" | grep -qE "$shared_re"; then
            select_all "shared file changed"
          fi

          # Otherwise deploy only the deployables with a changed file under
          # their directory. A nested app's change also matches its parent
          # module, which redeploys too; that is cheap and keeps the two in
          # step.
          selected=""
          for module in $all_modules; do
            if echo "$changed" | grep -q "^$module/"; then
              selected="$selected$module"$'\n'
            fi
          done
          modules=$(printf '%s' "$selected" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Selected modules: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
  deploy:
    needs: discover
    # An empty matrix fails the run, so skip when no deployable changed.
    if: needs.discover.outputs.modules != '[]'
    name: Deploy ${{ matrix.module }}
    runs-on: ubuntu-latest
    concurrency: deploy-${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - id: app
        run: |
          app=$(awk -F"'" '/^app *=/ {print $2}' ${{ matrix.module }}/fly.toml)
          echo "name=$app" >> "$GITHUB_OUTPUT"
      - name: Create the Fly.io app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
          APP: ${{ steps.app.outputs.name }}
        # A module added since the last deploy has no app yet, and pushing its
        # image would fail with "app repository not found". It is created in
        # the FLY_ORG repository variable's organization, or else in the one
        # the existing apps live in, like pr-preview.yml does.
        run: |
          apps=$(flyctl apps list --json)
          if ! echo "$apps" | jq -e --arg name "$APP" '.[] | select(.Name == $name)' > /dev/null; then
            org=${FLY_ORG:-$(echo "$apps" | jq -r 'first.Organization.Slug // "personal"')}
            flyctl apps create "$APP" --org "$org"
          fi
          flyctl auth docker
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: registry.fly.io/${{ steps.app.outputs.name }}:${{ github.sha }}
          secrets: |
            proKey=${{ secrets.VAADIN_PRO_KEY }}
          cache-from: type=gha,scope=${{ steps.app.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.app.outputs.name }}
      - run: flyctl deploy --image registry.fly.io/${{ steps.app.outputs.name }}:${{ github.sha }} --config ${{ matrix.module }}/fly.toml --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

name: PR Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  prime-cache:
    name: Prime Maven cache
    runs-on: ubuntu-26.04
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B -DskipTests dependency:go-offline
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}
      - id: find
        run: |
          modules=$(find . -mindepth 2 -maxdepth 2 -name pom.xml -printf '%h\n' \
            | sed 's|^\./||' \
            | grep -v '^common$' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Discovered modules: $modules"

  build:
    name: Build ${{ matrix.module }}
    needs: prime-cache
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prime-cache.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -pl ${{ matrix.module }} -am install
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}

  build-result:
    name: Build result
    needs: build
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check build matrix status
        if: needs.build.result != 'success'
        run: exit 1
